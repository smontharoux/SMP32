<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test AR - Jeu d'Enquête</title>
    
    <!-- A-Frame et MindAR via CDN -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        /* Écran de contrôle de la géolocalisation */
        #security-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111111;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .btn {
            background: #d4ac0d;
            color: #111111;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
        }
        .btn:hover { background: #b7950b; }
        #status-msg {
            margin-top: 15px;
            font-size: 15px;
            color: #f39c12;
            font-weight: bold;
            max-width: 80%;
        }
    </style>
</head>
<body>

    <!-- Écran de validation GPS (Bloque l'accès visuel tant qu'on n'y est pas) -->
    <div id="security-screen">
        <h2>🔒 Zone d'Enquête Sécurisée</h2>
        <p>Rendez-vous sur place pour valider votre position GPS et déverrouiller l'indice AR.</p>
        <button class="btn" onclick="verifyLocation()">Valider ma position</button>
        <div id="status-msg"></div>
    </div>

    <!-- Scène AR MindAR (Masquée par défaut) -->
    <a-scene id="ar-scene" mindar-image="imageTargetSrc: ./targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" style="display: none;">
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        
        <!-- Cible MindAR (index 0) -->
        <a-entity mindar-image-target="targetIndex: 0">
            <!-- Plan de fond semi-transparent et texte du code superposé en RA -->
            <a-plane color="#000000" opacity="0.7" position="0 0 0" height="0.4" width="1.2" rotation="0 0 0">
                <a-text id="ar-code-display" value="" align="center" color="#F1C40F" position="0 0 0.05" scale="0.7 0.7 0.7"></a-text>
            </a-plane>
        </a-entity>
    </a-scene>

    <script>
        // --- CONFIGURATION DU TEST ---
        const TEST_CODE = "V59A2K"; // Le code affiché en RA une fois validé

        // Coordonnées GPS de la cible sur le terrain (Modifiez avec vos coordonnées de test)
        const TARGET_LAT = 45.5077421; 
        const TARGET_LNG = 4.7344563;
        const MAX_DISTANCE_METERS = 50; // Rayon autorisé en mètres

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // Rayon de la terre en mètres
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;

            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

            return R * c;
        }

        function verifyLocation() {
            const statusMsg = document.getElementById("status-msg");
            statusMsg.innerText = "Recherche de la position GPS...";

            if (!navigator.geolocation) {
                statusMsg.innerText = "La géolocalisation n'est pas supportée par votre navigateur.";
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const userLat = position.coords.latitude;
                    const userLng = position.coords.longitude;
                    
                    const distance = calculateDistance(userLat, userLng, TARGET_LAT, TARGET_LNG);

                    // Astuce pour tester chez vous : vous pouvez temporairement adapter 
                    // TARGET_LAT et TARGET_LNG avec vos coordonnées GPS actuelles.
                    if (distance <= MAX_DISTANCE_METERS) {
                        statusMsg.innerText = "Position validée ! Chargement de la caméra...";
                        
                        // Injection du code secret dans l'élément texte de la RA
                        document.getElementById("ar-code-display").setAttribute("value", TEST_CODE);

                        // Masquer l'écran de sécurité et afficher la scène MindAR
                        setTimeout(() => {
                            document.getElementById("security-screen").style.display = "none";
                            document.getElementById("ar-scene").style.display = "block";
                        }, 800);

                    } else {
                        statusMsg.innerText = `Trop loin ! Vous êtes à ${Math.round(distance)}m de la cible (Maximum autorisé : ${MAX_DISTANCE_METERS}m).`;
                    }
                },
                (error) => {
                    statusMsg.innerText = "Erreur GPS : Veuillez autoriser la géolocalisation sur votre mobile.";
                    console.error(error);
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }
    </script>
</body>
</html>
